<html lang="es">
<head>

<title>Prueba de diseño banners</title>
<!-- PRUEBA-DISENO-v1: pagina temporal para verificar que los archivos nuevos SI se sirven -->
<link rel="stylesheet" href="/assets/css/banners.css?v=1">
<link rel="stylesheet" href="/assets/css/banners-v2.css?v=1">
<style>
  body{font-family:Arial;background:#f7efe2;padding:20px}
  h1{color:#6d071a}
  .nota{background:#fff;border:1px solid #ccc;padding:10px;border-radius:8px;margin:10px 0}

<body>

  <div class="banners-fila">
    <div class="banner-anuncio"><img src="https://dechimbote.com/assets/uploads/banners/banner-01.webp" alt="1"></div>

    <div class="banner-anuncio"><img src="https://dechimbote.com/assets/uploads/banners/banner-03.webp" alt="3"></div>
  </div>
  <script>document.querySelectorAll('.nota')[1].textContent += ' (CSS carga: ' + (getComputedStyle(document.querySelector('.banners-fila')).gridTemplateColumns) + ')'</script>
